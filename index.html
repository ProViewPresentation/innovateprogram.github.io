<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Innovate — Under Development</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0a0a0a;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 20px;
        max-width: 480px;
      }
      .logo {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #444;
      }
      .icon {
        font-size: 40px;
        line-height: 1;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
        color: #888;
      }
      .track {
        width: 280px;
        max-width: 100%;
        height: 2px;
        background: #222;
        border-radius: 1px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 40%;
        background: #fff;
        border-radius: 1px;
        animation: slide 1.6s ease-in-out infinite alternate;
      }
      @keyframes slide {
        from {
          transform: translateX(-20%);
        }
        to {
          transform: translateX(170%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fill {
          animation: none;
        }
      }
      a {
        font-size: 13px;
        color: #666;
        text-decoration: none;
        border-bottom: 1px solid #333;
        padding-bottom: 2px;
        transition:
          color 0.2s ease,
          border-color 0.2s ease;
      }
      a:hover,
      a:focus-visible {
        color: #fff;
        border-color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Innovate</div>
      <div class="icon" aria-hidden="true">🚧</div>
      <h1>Under Development</h1>
      <p>
        This part of the site is currently under development.<br />
        Please check back soon.
      </p>
      <div class="track" aria-hidden="true"><div class="fill"></div></div>
      <a href="ads/">Looking for the display? Go to /ads →</a>
    </main>
  </body>
</html>
