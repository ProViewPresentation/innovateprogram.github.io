<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Remote Browser Control</title>
<style>
  :root {
    --bg: #0d0e12;
    --card: #17181f;
    --card-hover: #1e2029;
    --border: #2a2c36;
    --text: #f2f2f5;
    --muted: #8f9099;
    --accent: #4b5eff;
    --accent-hover: #3c4de0;
    --green: #3ecf6f;
    --red: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .badge {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  input[type=text] {
    width: 100%;
    padding: 10px 12px;
    background: #0d0e12;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button.primary {
    padding: 10px 16px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }

  .device-list { display: flex; flex-direction: column; gap: 10px; }
  .device-card {
    background: #0d0e12;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .device-card:hover { border-color: var(--accent); }
  .device-card.selected { border-color: var(--accent); background: #14162a; }
  .device-name { font-weight: 600; font-size: 14px; }
  .device-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .online { background: var(--green); }
  .offline { background: var(--red); }

  .tab-list { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
  .tab-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: #0d0e12;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .tab-item:hover { border-color: var(--accent); }
  .tab-item.selected { border-color: var(--accent); background: #14162a; }
  .tab-item img { width: 16px; height: 16px; flex-shrink: 0; border-radius: 3px; }
  .tab-item .tab-text { overflow: hidden; }
  .tab-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-url { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .active-pill {
    font-size: 10px;
    background: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .control-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 8px;
    background: #0d0e12;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
  }
  .control-btn:hover:not(:disabled) { border-color: var(--accent); background: #14162a; }
  .control-btn:disabled { opacity: .4; cursor: not-allowed; }
  .control-btn svg { width: 22px; height: 22px; }
  .close-btn:hover:not(:disabled) { border-color: var(--red); }

  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: all .25s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="badge"></span> Remote Browser Control</h1>
  </header>

  <div class="panel">
    <label>Firebase Database URL</label>
    <input type="text" id="dbUrl" placeholder="https://your-project-default-rtdb.firebaseio.com" />
    <p style="font-size:12px;color:var(--muted);margin:8px 0 0;">Saved locally in your browser. Pulled from your Firebase project settings.</p>
  </div>

  <div class="panel">
    <label>Devices</label>
    <div id="deviceList" class="device-list">
      <p class="empty">Enter your Database URL above to load devices…</p>
    </div>
  </div>

  <div class="panel" id="tabsPanel" style="display:none;">
    <label>Tabs on this device</label>
    <div id="tabList" class="tab-list"></div>
  </div>

  <div class="panel" id="controlsPanel" style="display:none;">
    <label>Controls</label>
    <div class="controls">
      <button class="control-btn" id="btnRefresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
      <button class="control-btn" id="btnBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Back
      </button>
      <button class="control-btn" id="btnForward">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
        Forward
      </button>
      <button class="control-btn close-btn" id="btnClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        Close Tab
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
